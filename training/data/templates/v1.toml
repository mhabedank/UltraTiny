  { text = "Wie lautet die Landeshauptstadt von {subject}?", split = "train" },
  { text = "Von welchem Bundesland ist {object} die Hauptstadt?", split = "train", answer = "{object} ist die Hauptstadt von {subject}." },
  { text = "Welches Bundesland hat die Hauptstadt {object}?", split = "train", answer = "{object} ist die Hauptstadt von {subject}." },
  { text = "{object} ist die Hauptstadt von welchem Bundesland?", split = "train", answer = "{object} ist die Hauptstadt von {subject}." },
  { text = "Kennst du die Landeshauptstadt von {subject}?", split = "heldout" },
