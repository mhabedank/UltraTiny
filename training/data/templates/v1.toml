# Templates for the relations of the full knowledge base (v1). Rules: see starter.toml.

[relations.landeshauptstadt_von]
answers = ["Die Hauptstadt von {subject} ist {object}."]
questions = [
  { text = "Was ist die Landeshauptstadt von {subject}?", split = "train" },
  { text = "Wie heißt die Landeshauptstadt von {subject}?", split = "train" },
  { text = "Was ist die Hauptstadt von {subject}?", split = "train" },
