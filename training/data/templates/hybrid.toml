# Question types of the hybrid chemistry teacher (specs/006-hybrid-chemielehrer, research R4,
# data-model.md "Question type" / "Question form").
#
# Each type: one letter `code` (the table key), the object kinds it applies to, whether it needs a
# value record, the answer template (printed by the board, NOT generated by the model) and an
# optional "not applicable" text. The not-applicable text CONTINUES the template prefix (the prefix
# is already printed when the lookup finds no value), e.g. "Das typische Ion von " + "{name} gibt
# es nicht." Without it the board continues with "{name}: dazu habe ich keine Angabe." Templates MUST start with fixed text (the prefix is printed as
# soon as the type letter arrives). Slots: {name}, {key}, {v} (this type's value), {X} (value of
# type X for the same object). Templates/values may use characters outside the model alphabet.
#
# Forms: >= 12 per type in >= 4 families. Families: w (W-Frage), imp (Nenne/Gib an/Bestimme/
# Berechne/Stelle auf), kurz (Kurzform), satz (Satz/Lückentext), alltag (Umgangssprache),
# multi (two facts asked, target = the first named type; never held back). Placeholders in forms:
# {name} = object name (or alias), {key} = key the model copies (symbol, formula, number).
# One family per type (not multi) is held back from training by datagen (heldout_family).

[types.S]
name = "element_symbol"
kinds = ["element"]
needs_value = false
template = "Das Symbol von {name} ist {key}."
forms = [
  { text = "Welches Symbol hat {name}?", family = "w" },
  { text = "Was ist das Symbol von {name}?", family = "w" },
  { text = "Wie lautet das Elementsymbol von {name}?", family = "w" },
  { text = "Nenne das Symbol von {name}.", family = "imp" },
  { text = "Gib das Elementsymbol von {name} an.", family = "imp" },
  { text = "Schreibe das chemische Zeichen für {name} auf.", family = "imp" },
  { text = "Symbol von {name}?", family = "kurz" },
  { text = "{name} Symbol?", family = "kurz" },
  { text = "Elementsymbol {name}", family = "kurz" },
  { text = "Das Symbol für {name} ist welches?", family = "satz" },
  { text = "{name} hat das Symbol ...?", family = "satz" },
  { text = "Wie kürzt man {name} ab?", family = "alltag" },
  { text = "Mit welchem Buchstaben schreibt man {name} in der Chemie?", family = "alltag" },
  { text = "Symbol und Ordnungszahl von {name}?", family = "multi" },
]

