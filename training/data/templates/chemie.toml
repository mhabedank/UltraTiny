# Templates for the chemistry-teacher model (specs/003-chemielehrer).
# Rules: >= 8 question templates per relation, >= 2 held out. `repeat` oversamples a relation's
# training lines (FR-006). Free relations: Fact.subject = phrasings separated by "|".

[relations.element_symbol]
answers = ["Das Symbol von {subject} ist {object}."]
questions = [
  { text = "Was ist das Symbol von {subject}?", split = "train" },
  { text = "Welches Symbol hat {subject}?", split = "train" },
  { text = "Wie lautet das Elementsymbol von {subject}?", split = "train" },
  { text = "Symbol von {subject}?", split = "train" },
  { text = "Welches chemische Zeichen hat {subject}?", split = "train" },
  { text = "Was ist das chemische Symbol für {subject}?", split = "train" },
  { text = "Nenne das Symbol von {subject}.", split = "train" },
  { text = "Welches Element hat das Symbol {object}?", split = "train", answer = "{object} ist das Symbol von {subject}." },
  { text = "Wofür steht das Symbol {object}?", split = "train", answer = "{object} ist das Symbol von {subject}." },
  { text = "Welches Element hat das Zeichen {object}?", split = "train", answer = "{object} ist das Symbol von {subject}." },
  { text = "Was bedeutet das Symbol {object}?", split = "train", answer = "{object} ist das Symbol von {subject}." },
  { text = "Wie kürzt man {subject} in der Chemie ab?", split = "heldout" },
  { text = "Welches Elementsymbol hat {subject}?", split = "heldout" },
  { text = "Für welches Element steht {object}?", split = "heldout", answer = "{object} ist das Symbol von {subject}." },
]

[relations.element_ordnungszahl]
answers = ["{subject} hat die Ordnungszahl {object}."]
questions = [
  { text = "Welche Ordnungszahl hat {subject}?", split = "train" },
  { text = "Was ist die Ordnungszahl von {subject}?", split = "train" },
  { text = "Ordnungszahl von {subject}?", split = "train" },
  { text = "Wie lautet die Ordnungszahl von {subject}?", split = "train" },
  { text = "Welche Kernladungszahl hat {subject}?", split = "train" },
  { text = "Wie viele Protonen hat ein Atom von {subject}?", split = "train" },
  { text = "Nenne die Ordnungszahl von {subject}.", split = "train" },
  { text = "Welches Element hat die Ordnungszahl {object}?", split = "train", answer = "Das Element mit der Ordnungszahl {object} ist {subject}." },
  { text = "Element Nummer {object}?", split = "train", answer = "Das Element mit der Ordnungszahl {object} ist {subject}." },
  { text = "Welches Element steht an Stelle {object} im Periodensystem?", split = "train", answer = "Das Element mit der Ordnungszahl {object} ist {subject}." },
  { text = "Welche Nummer hat {subject} im Periodensystem?", split = "heldout" },
  { text = "Wie viele Protonen sind im Kern von {subject}?", split = "heldout" },
  { text = "Was ist Element Nummer {object}?", split = "heldout", answer = "Das Element mit der Ordnungszahl {object} ist {subject}." },
]

[relations.element_atommasse]
answers = ["Die Atommasse von {subject} beträgt etwa {object} u."]
questions = [
