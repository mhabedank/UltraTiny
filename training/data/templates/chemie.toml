  { text = "Wie groß ist die Atommasse von {subject}?", split = "train" },
  { text = "Atommasse von {subject}?", split = "train" },
  { text = "Was ist die relative Atommasse von {subject}?", split = "train" },
  { text = "Wie schwer ist ein Atom von {subject}?", split = "train" },
  { text = "Nenne die Atommasse von {subject}.", split = "train" },
  { text = "Wie viel wiegt ein {subject}-Atom in u?", split = "train" },
  { text = "Welche Masse hat ein Atom {subject}?", split = "train" },
  { text = "Wie lautet die Atommasse von {subject}?", split = "heldout" },
  { text = "Wie schwer sind {subject}-Atome?", split = "heldout" },
]

[relations.element_periode]
answers = ["{subject} steht in der {object}. Periode."]
questions = [
  { text = "In welcher Periode steht {subject}?", split = "train" },
