[relations.frei]
free = true
repeat = 3
answers = ["{object}"]
questions = [{ text = "{subject}", split = "train" }]

[relations.abweisen]
free = true
repeat = 1
answers = ["{object}"]
questions = [{ text = "{subject}", split = "train" }]
