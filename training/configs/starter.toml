# Starter model: release architecture (research.md R1), starter facts only.
name = "starter"

[model]
d_model = 128
n_layers = 4
n_heads = 4
n_kv_heads = 1
d_ff = 384
ctx_len = 256

[data]
facts = ["data/facts/starter.tsv"]
templates = ["data/templates/starter.toml"]
noisy_copies = 3

[train]
steps = 3000
batch_size = 64
lr = 3e-3
min_lr = 2e-4
warmup_steps = 100

[eval]
demo_min = 0.80
heldout_min = 0.60
golden_cases = 24
