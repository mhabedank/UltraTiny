# Tiny config for CI and tests: trains in well under a minute on CPU.
name = "tiny-test"

[model]
d_model = 32
n_layers = 1
n_heads = 4
n_kv_heads = 1
d_ff = 64
ctx_len = 64

[data]
facts = ["data/facts/starter.tsv"]
templates = ["data/templates/starter.toml"]
noisy_copies = 0

[train]
steps = 30
batch_size = 16
lr = 3e-3
min_lr = 3e-4
warmup_steps = 5
num_threads = 1

[eval]
demo_min = 0.0
heldout_min = 0.0
golden_cases = 4
