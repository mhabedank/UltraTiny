[value_classes.symbol]
kind = "vocab"
case_sensitive = true

[value_classes.element_name]
kind = "vocab"
case_sensitive = false

[value_classes.city]
kind = "vocab"
case_sensitive = false

[value_classes.country]
kind = "vocab"
case_sensitive = false

[value_classes.number]
kind = "number"
decimals = 2
units = ["u", "g/mol"]

[properties.element_symbol]
value_class = "symbol"
canonical = "Welches Symbol hat {name}?"

[properties.symbol_element]
value_class = "element_name"
canonical = "Wofür steht das Symbol {key}?"
reverse = true

[properties.element_atommasse]
value_class = "number"
canonical = "Welche Atommasse hat {name}?"

[properties.hauptstadt_von]
value_class = "city"
canonical = "Was ist die Hauptstadt von {name}?"

[properties.hauptstadt_land]
value_class = "country"
canonical = "Von welchem Land ist {key} die Hauptstadt?"
reverse = true

[thresholds]
