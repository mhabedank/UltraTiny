name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: training
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: "Knowledge topics (specs/008): preparation steps current, images current, compat"
        run: |
          for prep in ../topics/*/prepare.py; do
            [ -f "$prep" ] && uv run python "$prep" --check
          done
          for t in ../topics/*/; do
            id=$(basename "$t")
            compat=""
            if grep -q '^\[compat\]' "$t/topic.toml"; then compat="--compat"; fi
            uv run ut knowledge check --topic "$t" --image "../models/$id.utki" $compat
          done
      - name: Benchmark check of the repo model (specs/007 FR-024; any change fails)
        run: >-
          uv run python ../tools/bench.py pc --suite ../bench/suites/allgemein
          --model ../models/nodemcu.utny --check ../bench/results/nodemcu_allgemein_pc.json

  runtime-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build runtime and run tests (incl. parity vs golden vectors)
        run: |
          cmake -S runtime -B build
          cmake --build build -j
          ctest --test-dir build --output-on-failure
      - name: Parity of the committed models
        run: |
          ./build/utiny-host --model models/starter.utny --golden models/starter_golden.json
          ./build/utiny-host --model models/nodemcu.utny --golden models/nodemcu_golden.json
      - name: Budget report (models; NodeMCU is the target, ESP32 legacy)
        working-directory: training
        run: |
          uv sync
          uv run python ../tools/budget_report.py --board nodemcu --model ../models/nodemcu.utny
          uv run python ../tools/budget_report.py --board nodemcu --model ../runtime/tests/fixtures/tiny_v2.utny --facts ../models/chemie.utki
          uv run python ../tools/budget_report.py --board esp32 --model ../models/starter.utny
      - name: Benchmark board mode against the host console (specs/007, parity sample)
        working-directory: training
        run: >-
          uv run python ../tools/bench.py board --suite ../bench/suites/allgemein
          --model ../models/nodemcu.utny --sample parity --out /tmp/bench_host.json
          --exec "../build/utiny-host --model ../models/nodemcu.utny --console"

  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Build firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd firmware
          idf.py set-target esp32
          idf.py build
      - name: Budget report (firmware + model)
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          python tools/budget_report.py --board esp32 --model models/starter.utny --idf-build firmware/build

  # NodeMCU (ESP8266) firmware, specs/005-nodemcu-port: build + budget gate (firmware + model).
  firmware-nodemcu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware-nodemcu/platformio.ini') }}
      - name: Build firmware
        run: |
          pip install platformio
          cd firmware-nodemcu && pio run
      - name: Budget report (firmware + model)
        run: >-
          python tools/budget_report.py --board nodemcu --model models/nodemcu.utny
          --pio-build firmware-nodemcu/.pio/build/nodemcuv2
          --facts models/chemie.utki
