name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: training
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  runtime-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build runtime and run tests (incl. parity vs golden vectors)
        run: |
          cmake -S runtime -B build
          cmake --build build -j
          ctest --test-dir build --output-on-failure
      - name: Parity of the committed starter model
        run: ./build/utiny-host --model models/starter.utny --golden models/starter_golden.json
      - name: Budget report (model + arena)
        working-directory: training
        run: |
          uv sync
          uv run python ../tools/budget_report.py --model ../models/starter.utny

  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Build firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd firmware
          idf.py set-target esp32
          idf.py build
      - name: Budget report (firmware + model)
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          python tools/budget_report.py --model models/starter.utny --idf-build firmware/build
