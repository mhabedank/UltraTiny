questions = [{ question = "Welche Elemente sind Halbmetalle?", key = "Halbmetall", expect = "Stoffart Halbmetall: Bor, Silicium, Germanium, Arsen, Antimon und Tellur." }]

[views."zustand<"]
kind = "reverse"
relation = "zustand"
template = "Bei Raumtemperatur {key} sind: {v}."
more = " und {n} weitere"
questions = [{ question = "Welche Elemente sind bei Raumtemperatur flüssig?", key = "flüssig", expect = "Bei Raumtemperatur flüssig sind: Brom und Quecksilber." }]

[views."aussenelektronen<"]
kind = "reverse"
relation = "aussenelektronen"
template = "Genau {key} Außenelektronen haben: {v}."
more = " und {n} weitere"
