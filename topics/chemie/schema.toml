[views."schalen<"]
kind = "reverse"
relation = "schalen"
template = "Genau {key} Schalen haben: {v}."
more = " und {n} weitere"
questions = [{ question = "Welche Elemente haben 2 Schalen?", key = "2", expect = "Genau 2 Schalen haben: Lithium, Beryllium, Bor, Kohlenstoff, Stickstoff, Sauerstoff, Fluor und Neon." }]

[views."wertigkeit<"]
kind = "reverse"
relation = "wertigkeit"
template = "Die Wertigkeit {key} haben: {v}."
more = " und {n} weitere"
questions = [{ question = "Welche Elemente sind vierwertig?", key = "4", expect = "Die Wertigkeit 4 haben: Kohlenstoff, Silicium, Germanium, Zinn und Blei." }]

[views."bindung<"]
