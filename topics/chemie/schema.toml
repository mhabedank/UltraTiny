more = " und {n} weitere"
questions = [{ question = "Welche Elemente stehen in der 3. Hauptgruppe?", key = "3", expect = "Zur 3. Hauptgruppe gehören: Bor, Aluminium, Gallium, Indium, Thallium und Nihonium." }]

[views."periode<"]
kind = "reverse"
relation = "periode"
template = "Zur {key}. Periode gehören: {v}."
more = " und {n} weitere"
questions = [{ question = "Welche Elemente stehen in der 2. Periode?", key = "2", expect = "Zur 2. Periode gehören: Lithium, Beryllium, Bor, Kohlenstoff, Stickstoff, Sauerstoff und 2 weitere." }]

[views."familie<"]
kind = "reverse"
relation = "familie"
template = "Zu den {key} gehören: {v}."
more = " und {n} weitere"
questions = [{ question = "Welche Elemente sind Halogene?", key = "Halogenen", expect = "Zu den Halogenen gehören: Fluor, Chlor, Brom, Iod und Astat." }]

[views."kategorie<"]
kind = "reverse"
relation = "kategorie"
template = "Stoffart {key}: {v}."
