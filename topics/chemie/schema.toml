[views."elektronen<"]
kind = "reverse"
relation = "elektronen"
template = "Die Elektronenzahl {key} hat {name}."
questions = [{ question = "Welches Element hat 10 Elektronen?", key = "10", expect = "Die Elektronenzahl 10 hat Neon." }]

[views."atommasse<"]
