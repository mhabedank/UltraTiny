# Benchmark suite "chemie" (specs/007-benchmark-kpi-bericht): the chemistry curriculum of specs 003-006.
# facts.tsv is exported from the spec 006 fact set (tools/bench_export_facts.py, research R4);
# canonical questions are the first question form of each type in training/data/templates/hybrid.toml.
# Re-pin with `tools/bench.py pin --suite ../bench/suites/chemie`.
name = "chemie"
version = 1
max_question = 70
explain_max = 60
refusal_forms = [
  "Das weiß ich leider nicht.", "Frag mich etwas zur Chemie", ": dazu habe ich keine Angabe.",
  "gebe ich nicht an", "gehört zu keiner der Familien, die ich kenne", "weiß man das noch nicht genau",
  "noch nicht genau bekannt", "gehört nicht zum Schalenmodell der Schule", "gibt es nicht.",
  "kenne ich nicht genau genug", "kann ich nicht angeben", "ist weder Säure noch Lauge",
]
not_applicable = []

