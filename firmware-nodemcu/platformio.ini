; UltraTiny firmware for the NodeMCU (ESP8266), specs/005-nodemcu-port.
; Build: pio run   Flash: pio run -t upload   Model: make nodemcu-flash-model (repo root)
[platformio]
default_envs = nodemcuv2

[env:nodemcuv2]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
board_build.f_cpu = 160000000L
; Firmware area 0x0-0x57FFF, model area 0x58000-0xFFFFF (contracts/flash-layout.md)
board_build.ldscript = eagle.flash.4m.ultratiny.ld
build_flags =
    -O2
    -ffp-contract=off
    -fno-fast-math
    -fsingle-precision-constant
    -Iinclude
    -I../runtime/include
    -Lld
    -DUT_MAX_ANSWER=104
lib_deps = utiny
upload_speed = 460800
monitor_speed = 115200
